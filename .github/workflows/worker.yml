# Roda o worker aqui dentro do GitHub, sob demanda.
#
# Com a fonte de coleta OFICIAL (`collection.source = 'graph'`, o padrao), tudo
# roda aqui: extracao de roteiro E analise de perfil. Nao existe navegador nem
# sessao envolvida, entao nao ha risco nenhum para a sua conta do Instagram.
#
# So se voce trocar para `collection.source = 'scraper'` isto deixa de valer: a
# sessao do Instagram e do seu IP residencial, e navegar com ela a partir de um
# datacenter e o padrao que mais dispara checkpoint. Nesse caso o worker precisa
# rodar numa maquina sua.
name: Worker

on:
  workflow_dispatch:
    inputs:
      minutos:
        description: 'Quantos minutos o worker fica ligado processando a fila'
        required: true
        default: '10'
        type: choice
        options: ['5', '10', '20', '30']

jobs:
  processar:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # O runner do GitHub costuma ja trazer ffmpeg, mas isso nao e garantido
      # entre versoes de imagem. Sem ele a Fase 1 nao roda.
      - name: Garantir o ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            echo "ffmpeg ausente na imagem, instalando..."
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Processar a fila
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          # Fase 1: transcricao no Groq, analise no provedor escolhido em
          # packages/config (models.analysis). Só a chave do provedor ativo
          # precisa existir.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Coleta pela API oficial do Instagram (Business Discovery).
          IG_GRAPH_TOKEN: ${{ secrets.IG_GRAPH_TOKEN }}
          IG_GRAPH_USER_ID: ${{ secrets.IG_GRAPH_USER_ID }}
        run: |
          set +e
          # O worker e um loop infinito de proposito. O timeout manda SIGTERM,
          # que ele trata encerrando com calma; -k mata se travar.
          timeout -k 15s ${{ inputs.minutos }}m npx tsx apps/worker/src/index.ts
          codigo=$?
          set -e
          # 124 = timeout expirou, 143 = SIGTERM. Os dois sao encerramento normal.
          if [ $codigo -eq 0 ] || [ $codigo -eq 124 ] || [ $codigo -eq 143 ]; then
            echo "Worker encerrado normalmente (codigo $codigo)."
          else
            echo "Worker saiu com erro (codigo $codigo)."
            exit $codigo
          fi

      - name: Guardar o log para auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-do-worker
          path: apps/worker/data/logs/
          if-no-files-found: ignore
