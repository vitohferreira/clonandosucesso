services:
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: .env
    environment:
      MOLDE_DATA_DIR: /data
      MOLDE_IN_CONTAINER: '1'
    volumes:
      # A sessao gravada pelo script de login (que roda no HOST) chega ao
      # container por aqui. Logs e midia temporaria voltam pelo mesmo caminho.
      - ./apps/worker/data:/data
    # Roda com o seu usuario para os arquivos em data/ nao virarem root no host.
    # No Linux: export MOLDE_UID=$(id -u) MOLDE_GID=$(id -g)
    user: '${MOLDE_UID:-1000}:${MOLDE_GID:-1000}'
    # Encaminha SIGTERM direito, para o encerramento gracioso funcionar.
    init: true
    # Tempo para o job em andamento parar num ponto seguro.
    stop_grace_period: 60s
    restart: unless-stopped
